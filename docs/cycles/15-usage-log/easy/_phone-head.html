<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TITLE_HERE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--card:#fff;--text:#1d2125;--muted:#646b74;--line:#e4e0d8;--accent:#2f5d8a;--accent-bg:#e9f0f7;--ok:#1f7a45;--ok-bg:#e4f3ea;--warn:#8a5a00;--warn-bg:#fbf1dc;--no:#a1302b;--no-bg:#f8e4e2;--code-bg:#f1efea}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;font-size:19px;line-height:1.72;word-break:keep-all;overflow-wrap:break-word}
main{max-width:640px;margin:0 auto;padding:20px 14px calc(56px + env(safe-area-inset-bottom))}
h1,h2,h3{text-wrap:balance;line-height:1.4}
p,li,td{text-wrap:pretty}
.lead{font-size:22px;font-weight:700;margin:6px 2px 6px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:14px;margin:0 2px 22px}
.card{background:var(--card);border-radius:18px;padding:20px 16px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.card h2{font-size:19px;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.num{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px}
.gist{background:var(--accent-bg);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:500;font-size:18px}
.item{border-top:1px solid var(--line);padding:16px 0 4px}
.card h2+.item,.gist+.item{border-top:none;padding-top:4px}
.item h3{font-size:19.5px;margin:0 0 8px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.no{flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--warn);border-radius:8px;padding:1px 8px;margin-top:2px}
.pick{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 7px;margin-top:3px}
.item p{margin:8px 0}
.alt{color:var(--muted);font-size:17px;background:var(--code-bg);border-radius:10px;padding:10px 12px}
.alt b{color:var(--text)}
code{font-family:ui-monospace,Consolas,monospace;font-size:.84em;background:var(--code-bg);padding:1px 5px;border-radius:5px;word-break:break-all}
a{color:var(--accent)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:16px;margin:10px 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
tr:first-child th,tr:first-child td{border-top:none}
th{background:var(--code-bg);font-weight:700;font-size:13.5px;color:var(--muted)}
td:first-child{font-weight:500;width:38%}
figure{margin:8px 0 14px}figure svg{width:100%;height:auto;display:block}
figcaption{color:var(--muted);font-size:15.5px;margin-top:6px}
ul{padding-left:20px;margin:8px 0}li{margin:4px 0}
.note{color:var(--muted);font-size:14px}
.foot{color:var(--muted);font-size:13px;margin:24px 2px 0}
.answer{margin-top:14px;font-size:14.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 16px}
@media (min-width:700px){body{font-size:17.5px}.lead{font-size:26px}main{padding-top:36px}}
</style>
</head>
